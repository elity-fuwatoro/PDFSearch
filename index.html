<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スマートPDF検索</title>

  <!-- PDF.js のみ外部から読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    /* ==========================================
       CSS Variables & Reset
       ========================================== */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-active: #3730a3;
      --primary-light: #e0e7ff;
      --bg-color: #f9fafb;
      --surface: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --highlight: rgba(253, 224, 71, 0.45);
      --highlight-solid: #fde047;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --radius-2xl: 1rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 5rem;
      -webkit-font-smoothing: antialiased;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* ==========================================
       Layout & Components
       ========================================== */
    .header {
      background-color: var(--primary);
      color: white;
      padding: 1rem;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.125rem;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Cards */
    .card {
      background-color: var(--surface);
      padding: 1.5rem;
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .card-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-xl);
      font-weight: 600;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-primary:active:not(:disabled) {
      background-color: var(--primary-active);
    }

    .btn-disabled {
      background-color: #9ca3af;
      color: white;
      cursor: not-allowed;
    }

    .btn-text {
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 0.5rem;
    }

    .btn-text:hover {
      color: #ef4444;
    }

    /* Icons */
    .icon-circle {
      width: 4rem;
      height: 4rem;
      background-color: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      max-width: 20rem;
      background-color: #e5e7eb;
      border-radius: 9999px;
      height: 0.5rem;
      margin: 1rem 0;
    }

    .progress-bar {
      background-color: var(--primary);
      height: 100%;
      border-radius: 9999px;
      transition: width 0.3s ease-out;
    }

    /* Search Input */
    .search-wrapper {
      position: sticky;
      top: 60px;
      /* Header height offset */
      z-index: 10;
      background: rgba(249, 250, 251, 0.95);
      backdrop-filter: blur(4px);
      padding: 0.5rem 0 1rem;
    }

    .search-input-box {
      position: relative;
    }

    .search-icon-left {
      position: absolute;
      top: 50%;
      left: 0.75rem;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .search-input {
      width: 100%;
      padding: 0.875rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      font-size: 1rem;
      outline: none;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .search-clear-btn {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .search-clear-btn:hover {
      color: var(--text-muted);
    }

    .search-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      padding: 0 0.25rem;
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-primary {
      background-color: var(--primary-light);
      color: var(--primary-active);
    }

    .badge-success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
      display: inline-flex;
      align-items: center;
      font-size: 0.65rem;
    }

    .badge-gray {
      background-color: #f3f4f6;
      color: #4b5563;
      border: 1px solid var(--border);
    }

    /* Result Card */
    .result-card {
      background-color: var(--surface);
      padding: 1rem;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.75rem;
    }

    .result-card:hover {
      border-color: #a5b4fc;
      box-shadow: var(--shadow-md);
    }

    .result-card:active {
      background-color: #f9fafb;
    }

    .result-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .result-card-tags {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result-card-link {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 500;
    }

    .result-card-snippet {
      font-size: 0.875rem;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Highlight */
    mark {
      background-color: var(--highlight-solid);
      color: #111827;
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 500;
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background-color: #1f2937;
      color: white;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      z-index: 20;
      transition: transform 0.1s;
    }

    .fab:active {
      transform: scale(0.95);
    }

    /* ==========================================
       Modal
       ========================================== */
    body.modal-open {
      overflow: hidden;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-container {
      background-color: var(--surface);
      width: 100%;
      max-width: 72rem;
      height: 96vh;
      border-radius: var(--radius-2xl);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background-color: var(--primary-light);
      border-bottom: 1px solid var(--border);
    }

    .modal-nav-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn {
      background-color: white;
      color: var(--primary);
      border: 1px solid #e0e7ff;
      border-radius: 50%;
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: #eef2ff;
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .modal-title {
      font-weight: bold;
      color: var(--primary-active);
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0 0.5rem;
    }

    .modal-close {
      color: var(--text-muted);
      padding: 0.375rem;
      border-radius: 50%;
    }

    .modal-close:hover {
      background-color: #e5e7eb;
      color: #374151;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-muted);
      background-color: white;
    }

    .tab:hover:not(.active) {
      background-color: #f9fafb;
    }

    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      background-color: rgba(238, 242, 255, 0.5);
    }

    /* Modal Content */
    .modal-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #f3f4f6;
    }

    .modal-text-view {
      padding: 1.5rem;
      overflow-y: auto;
      font-size: 1rem;
      line-height: 2;
      color: #1f2937;
      white-space: pre-wrap;
      word-break: break-word;
      background-color: white;
      height: 100%;
    }

    /* PDF Viewer Elements */
    .pdf-viewer {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      padding: 1rem;
      position: relative;
    }

    .pdf-wrapper {
      margin: auto;
      position: relative;
      background-color: white;
      box-shadow: var(--shadow-lg);
    }

    canvas {
      display: block;
    }

    .pdf-text-layer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      line-height: 1.0;
      color: transparent;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    .pdf-text-layer>span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .pdf-text-layer mark {
      background-color: var(--highlight);
      color: transparent;
      border-radius: 2px;
      box-shadow: 0 0 2px rgba(253, 224, 71, 0.5);
    }

    .zoom-controls {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background-color: rgba(31, 41, 55, 0.9);
      backdrop-filter: blur(4px);
      color: white;
      padding: 0.375rem;
      border-radius: 9999px;
      box-shadow: var(--shadow-lg);
      z-index: 20;
    }

    .zoom-btn {
      padding: 0.5rem;
      border-radius: 50%;
    }

    .zoom-btn:hover:not(:disabled) {
      background-color: #4b5563;
    }

    .zoom-btn:disabled {
      opacity: 0.3;
    }

    .zoom-text {
      font-size: 0.875rem;
      font-weight: 500;
      width: 3rem;
      text-align: center;
      pointer-events: none;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(229, 231, 235, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Modal Footer */
    .modal-footer {
      padding: 1rem;
      background-color: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result-nav-label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .result-nav-btn {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem;
      background-color: #fef08a;
      /* yellow-200 */
      color: #854d0e;
      /* yellow-800 */
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-xl);
      border: 1px solid #fde047;
      transition: all 0.2s;
    }

    .result-nav-btn:hover:not(:disabled) {
      background-color: #fde047;
    }

    .result-nav-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .result-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .result-index {
      font-size: 0.875rem;
      font-weight: 600;
      color: #4b5563;
      padding: 0 0.25rem;
    }

    /* Dialog */
    .dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .dialog-box {
      background-color: white;
      border-radius: var(--radius-2xl);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 24rem;
      padding: 1.5rem;
    }

    .dialog-msg {
      color: #1f2937;
      white-space: pre-wrap;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .btn-dialog-cancel {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      background-color: #f3f4f6;
      border-radius: var(--radius-xl);
    }

    .btn-dialog-cancel:hover {
      background-color: #e5e7eb;
    }

    .btn-dialog-ok {
      padding: 0.5rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: white;
      background-color: var(--primary);
      border-radius: var(--radius-xl);
    }

    .btn-dialog-ok:hover {
      background-color: var(--primary-hover);
    }

    .btn-dialog-danger {
      background-color: #ef4444;
    }

    .btn-dialog-danger:hover {
      background-color: #dc2626;
    }

    /* Utility animations */
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #9ca3af;
    }

    .empty-state svg {
      margin: 0 auto 1rem;
      opacity: 0.5;
    }

    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
      display: inline-block;
      vertical-align: bottom;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {

      .result-nav-label,
      .result-nav-btn span {
        display: none;
      }

      .result-nav-btn {
        padding: 0.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" x2="8" y1="13" y2="13" />
        <line x1="16" x2="8" y1="17" y2="17" />
        <line x1="10" x2="8" y1="9" y2="9" />
      </svg>
      <h1>スマートPDF検索</h1>
    </div>
    <button id="btn-reset" class="modal-close hidden" style="color:white" aria-label="ファイルを閉じる">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="m15 9-6 6" />
        <path d="m9 9 6 6" />
      </svg>
    </button>
  </header>

  <main class="container">

    <!-- 1. アップロード画面 -->
    <div id="view-upload" class="card card-center" style="margin-top: 2.5rem;">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
          <polyline points="14 2 14 8 20 8" />
          <path d="M12 12v6" />
          <path d="m15 15-3-3-3 3" />
        </svg>
      </div>
      <h2 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem;">PDFを選択してください</h2>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        対象のPDFファイルを選択すると、お使いの端末内で解析・検索が可能になります。通信は発生しません。
      </p>

      <input type="file" accept=".pdf" id="pdf-upload" class="hidden" />
      <label id="lbl-upload" for="pdf-upload" class="btn btn-disabled">
        準備中...
      </label>

      <button id="btn-clear-cache" class="btn-text"
        style="margin-top: 1.5rem; border-top: 1px solid var(--border); width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.25rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          <line x1="10" x2="10" y1="11" y2="17" />
          <line x1="14" x2="14" y1="11" y2="17" />
        </svg>
        保存されているキャッシュをすべて削除
      </button>
    </div>

    <!-- 2. ローディング画面 -->
    <div id="view-loading" class="card-center hidden" style="margin-top: 5rem;">
      <svg class="animate-spin" style="color: var(--primary); margin-bottom: 1.5rem;" xmlns="http://www.w3.org/2000/svg"
        width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <div>
        <p style="font-weight: bold; font-size: 1.125rem;">PDFを解析中...</p>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">端末の性能により数秒〜数十秒かかります</p>
      </div>
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>
      <p id="progress-text" style="color: var(--primary); font-weight: 500;">0% 完了</p>
    </div>

    <!-- 3. 検索画面 -->
    <div id="view-search" class="hidden">
      <div class="search-wrapper">
        <div class="search-input-box">
          <svg class="search-icon-left" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="検索キーワードを入力..." />
          <button id="btn-clear-search" class="search-clear-btn hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="m15 9-6 6" />
              <path d="m9 9 6 6" />
            </svg>

  <script>
    /**
     * ==========================================
     * IndexedDB Wrapper
     * ==========================================
     */
    const DB_NAME = 'PdfSearchAppDB_v2';
    const STORE_NAME = 'PdfCacheStore';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          e.target.result.createObjectStore(STORE_NAME);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveToCache = async (key, data) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(data, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.warn("キャッシュの保存に失敗しました", err);
      }
    };

    const loadFromCache = async (key) => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const request = tx.objectStore(STORE_NAME).get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      } catch (err) {
        console.warn("キャッシュの読み込みに失敗しました", err);
        return null;
      }
    };

    const clearAllCache = async () => {
      try {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const request = tx.objectStore(STORE_NAME).clear();
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      } catch (err) {
        console.warn("キャッシュの消去に失敗しました", err);
      }
    };

    /**
     * ==========================================
     * State & Application Logic
     * ==========================================
     */
    const state = {
      file: null,
      pdfData: null,
      pdfDoc: null,
      loading: false,
      progress: 0,
      searchQuery: '',
      debouncedQuery: '',
      searchResults: [],
      selectedPage: null,
      viewMode: 'pdf',
      loadedFromCache: false,
      zoom: 1.0
    };

    // DOM Elements
    const els = {
      viewUpload: document.getElementById('view-upload'),
      viewLoading: document.getElementById('view-loading'),
      viewSearch: document.getElementById('view-search'),
      lblUpload: document.getElementById('lbl-upload'),
      pdfUpload: document.getElementById('pdf-upload'),
      btnReset: document.getElementById('btn-reset'),
      btnClearCache: document.getElementById('btn-clear-cache'),
      progressBar: document.getElementById('progress-bar'),
      progressText: document.getElementById('progress-text'),
      searchInput: document.getElementById('search-input'),
      btnClearSearch: document.getElementById('btn-clear-search'),
      txtFileName: document.getElementById('txt-file-name'),
      txtTotalPages: document.getElementById('txt-total-pages'),
      badgeCacheLoaded: document.getElementById('badge-cache-loaded'),
      badgeHitCount: document.getElementById('badge-hit-count'),
      searchResultsList: document.getElementById('search-results-list'),
      searchEmptyState: document.getElementById('search-empty-state'),
      searchInitialState: document.getElementById('search-initial-state'),
      txtEmptyQuery: document.getElementById('txt-empty-query'),
      btnScrollTop: document.getElementById('btn-scroll-top'),

      modalOverlay: document.getElementById('modal-overlay'),
      modalTitlePage: document.getElementById('modal-title-page'),
      btnCloseModal: document.getElementById('btn-close-modal'),
      btnCloseModalFooter: document.getElementById('btn-close-modal-footer'),
      tabBtnPdf: document.getElementById('tab-btn-pdf'),
      tabBtnText: document.getElementById('tab-btn-text'),
      modalContentPdf: document.getElementById('modal-content-pdf'),
      modalContentText: document.getElementById('modal-content-text'),

      btnPrevPage: document.getElementById('btn-prev-page'),
      btnNextPage: document.getElementById('btn-next-page'),
      searchNavContainer: document.getElementById('search-nav-container'),
      btnPrevResult: document.getElementById('btn-prev-result'),
      btnNextResult: document.getElementById('btn-next-result'),
      txtResultIndex: document.getElementById('txt-result-index'),

      pdfScrollContainer: document.getElementById('pdf-scroll-container'),
      pdfWrapper: document.getElementById('pdf-wrapper'),
      pdfCanvas: document.getElementById('pdf-canvas'),
      pdfTextLayer: document.getElementById('pdf-text-layer'),
      pdfLoadingOverlay: document.getElementById('pdf-loading-overlay'),
      btnZoomOut: document.getElementById('btn-zoom-out'),
      btnZoomIn: document.getElementById('btn-zoom-in'),
      txtZoomLevel: document.getElementById('txt-zoom-level'),

      dialogOverlay: document.getElementById('dialog-overlay'),
      dialogMessage: document.getElementById('dialog-message'),
      btnDialogCancel: document.getElementById('btn-dialog-cancel'),
      btnDialogOk: document.getElementById('btn-dialog-ok'),
    };

    let searchTimeout = null;
    let currentRenderTask = null;
    let currentTextLayerTask = null;
    let dialogConfirmCallback = null;

    // --- Init ---
    window.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      els.lblUpload.classList.remove('btn-disabled');
      els.lblUpload.classList.add('btn-primary');
      els.lblUpload.textContent = 'ファイルを選択';
      els.pdfUpload.disabled = false;
    };

    // --- Dialog Helper ---
    function showDialog(type, message, onConfirm = null) {
      els.dialogMessage.textContent = message;
      els.dialogOverlay.classList.remove('hidden');

      if (type === 'confirm') {
        els.btnDialogCancel.classList.remove('hidden');
        els.btnDialogOk.classList.add('btn-dialog-danger');
        els.btnDialogOk.textContent = '削除する';
        dialogConfirmCallback = onConfirm;
      } else {
        els.btnDialogCancel.classList.add('hidden');
        els.btnDialogOk.classList.remove('btn-dialog-danger');
        els.btnDialogOk.textContent = 'OK';
        dialogConfirmCallback = null;
      }
    }

    function closeDialog() {
      els.dialogOverlay.classList.add('hidden');
    }

    els.btnDialogCancel.onclick = closeDialog;
    els.btnDialogOk.onclick = () => {
      if (dialogConfirmCallback) dialogConfirmCallback();
      closeDialog();
    };

    // --- Event Listeners ---
    els.pdfUpload.addEventListener('change', async (e) => {
      const selectedFile = e.target.files[0];
      if (!selectedFile || selectedFile.type !== 'application/pdf') {
        showDialog('alert', 'PDFファイルを選択してください。');
        return;
      }

      state.file = selectedFile;
      state.loading = true;
      state.progress = 0;
      state.pdfData = null;
      state.searchQuery = '';
      state.debouncedQuery = '';
      state.loadedFromCache = false;
      els.searchInput.value = '';

      updateMainView();

      try {
        const cacheKey = `${selectedFile.name}_${selectedFile.size}_${selectedFile.lastModified}`;
        const cachedData = await loadFromCache(cacheKey);

        const arrayBuffer = await selectedFile.arrayBuffer();
        const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        state.pdfDoc = pdf;

        if (cachedData) {
          state.pdfData = cachedData;
          state.progress = 100;
          state.loadedFromCache = true;
        } else {
          state.pdfData = await extractTextFromPdf(pdf);
          await saveToCache(cacheKey, state.pdfData);
        }
      } catch (error) {
        console.error("PDF解析エラー:", error);
        showDialog('alert', 'PDFの読み込みに失敗しました。暗号化されているか、ファイルが破損している可能性があります。');
        handleReset();
        return;
      } finally {
        state.loading = false;
        updateMainView();
      }
    });

    els.btnReset.onclick = handleReset;

    function handleReset() {
      state.file = null;
      state.pdfData = null;
      state.pdfDoc = null;
      state.searchQuery = '';
      state.debouncedQuery = '';
      state.selectedPage = null;
      state.loadedFromCache = false;
      els.pdfUpload.value = '';
      els.searchInput.value = '';
      closeModal();
      updateMainView();
    }

    els.btnClearCache.onclick = () => {
      showDialog('confirm', '保存されているすべてのPDFの解析キャッシュを削除しますか？\n（次回の読み込みに少し時間がかかるようになります）', async () => {
        await clearAllCache();
        showDialog('alert', 'キャッシュを削除しました。');
      });
    };

    els.searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;

      if (state.searchQuery) {
        els.btnClearSearch.classList.remove('hidden');
      } else {
        els.btnClearSearch.classList.add('hidden');
      }

      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        state.debouncedQuery = state.searchQuery;
        calculateSearchResults();
      }, 300);
    });

    els.btnClearSearch.onclick = () => {
      state.searchQuery = '';
      state.debouncedQuery = '';
      els.searchInput.value = '';
      els.btnClearSearch.classList.add('hidden');
      calculateSearchResults();
    };

    els.btnScrollTop.onclick = () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Modal Events
    els.btnCloseModal.onclick = closeModal;
    els.btnCloseModalFooter.onclick = closeModal;
    els.modalOverlay.onclick = (e) => {
      if (e.target === els.modalOverlay) closeModal();
    };

    els.tabBtnPdf.onclick = () => setModalViewMode('pdf');
    els.tabBtnText.onclick = () => setModalViewMode('text');

    els.btnZoomOut.onclick = () => {
      state.zoom = Math.max(1.0, state.zoom - 0.5);
      renderModalPdf();
    };
    els.btnZoomIn.onclick = () => {
      state.zoom = Math.min(3.0, state.zoom + 0.5);
      renderModalPdf();
    };

    // Navigation Events
    els.btnPrevPage.onclick = () => {
      if (state.selectedPage && state.selectedPage.page > 1) {
        openModal(state.selectedPage.page - 1);
      }
    };

    els.btnNextPage.onclick = () => {
      if (state.selectedPage && state.pdfData && state.selectedPage.page < state.pdfData.length) {
        openModal(state.selectedPage.page + 1);
      }
    };

    els.btnPrevResult.onclick = () => {
      if (!state.selectedPage || state.searchResults.length === 0) return;
      const currentPage = state.selectedPage.page;
      const prevResults = state.searchResults.filter(r => r.page < currentPage);
      if (prevResults.length > 0) {
        openModal(prevResults[prevResults.length - 1].page);
      }
    };

    els.btnNextResult.onclick = () => {
      if (!state.selectedPage || state.searchResults.length === 0) return;
      const currentPage = state.selectedPage.page;
      const nextResults = state.searchResults.filter(r => r.page > currentPage);
      if (nextResults.length > 0) {
        openModal(nextResults[0].page);
      }
    };


    // --- Core Logic (Performance Optimized) ---
    async function extractTextFromPdf(pdf) {
      const numPages = pdf.numPages;
      const extractedData = [];
      const batchSize = 10; // 並列バッチ処理

      for (let i = 1; i <= numPages; i += batchSize) {
        const batchPromises = [];
        const endPage = Math.min(i + batchSize - 1, numPages);

        for (let j = i; j <= endPage; j++) {
          batchPromises.push((async () => {
            const page = await pdf.getPage(j);
            const textContent = await page.getTextContent();

            const pageText = textContent.items
              .map(item => item.str)
              .join('')
              .replace(/\s+/g, ' ');

            // メモリ解放
            try { page.cleanup(); } catch (e) { }

            return { page: j, text: pageText };
          })());
        }

        const batchResults = await Promise.all(batchPromises);
        extractedData.push(...batchResults);

        state.progress = Math.round((endPage / numPages) * 100);
        els.progressBar.style.width = `${state.progress}%`;
        els.progressText.textContent = `${state.progress}% 完了`;
      }

      extractedData.sort((a, b) => a.page - b.page);
      return extractedData;
    }

    function calculateSearchResults() {
      if (!state.pdfData) return;

      const cleanQuery = state.debouncedQuery.replace(/[\s　]+/g, '');
      if (!cleanQuery) {
        state.searchResults = [];
        updateSearchResultsView();
        return;
      }

      const regexStr = cleanQuery
        .split('')
        .map(char => char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .join('\\s*');

      // 正規表現オブジェクトを1度だけ生成（最適化）
      const searchRegex = new RegExp(regexStr, 'gi');
      const results = [];

      state.pdfData.forEach((pageData) => {
        const text = pageData.text;
        const snippets = [];
        let matchCount = 0;
        let match;

        searchRegex.lastIndex = 0;

        while ((match = searchRegex.exec(text)) !== null) {
          matchCount++;

          if (snippets.length < 3) {
            const contextLength = 40;
            const snippetStart = Math.max(0, match.index - contextLength);
            const snippetEnd = Math.min(text.length, match.index + match[0].length + contextLength);

            let snippet = text.substring(snippetStart, snippetEnd);
            if (snippetStart > 0) snippet = '...' + snippet;
            if (snippetEnd < text.length) snippet = snippet + '...';

            snippets.push(snippet);
          }
        }

        if (matchCount > 0) {
          let combinedSnippet = snippets.join('\n・・・\n');
          if (matchCount > 3) {
            combinedSnippet += `\n\n（他 ${matchCount - 3} 箇所ヒットあり）`;
          }

          results.push({
            page: pageData.page,
            snippet: combinedSnippet,
            matchCount: matchCount,
            id: `page-${pageData.page}`
          });
        }
      });

      state.searchResults = results;
      updateSearchResultsView();
    }

    // --- DOM Rendering / Updates ---
    function updateMainView() {
      if (!state.file) {
        els.viewUpload.classList.remove('hidden');
        els.viewLoading.classList.add('hidden');
        els.viewSearch.classList.add('hidden');
        els.btnReset.classList.add('hidden');
      } else if (state.loading) {
        els.viewUpload.classList.add('hidden');
        els.viewLoading.classList.remove('hidden');
        els.viewSearch.classList.add('hidden');
        els.btnReset.classList.add('hidden');
        els.progressBar.style.width = '0%';
        els.progressText.textContent = '0% 完了';
      } else {
        els.viewUpload.classList.add('hidden');
        els.viewLoading.classList.add('hidden');
        els.viewSearch.classList.remove('hidden');
        els.btnReset.classList.remove('hidden');

        els.txtFileName.textContent = state.file.name;
        els.txtTotalPages.textContent = `（全${state.pdfData.length}ページ）`;

        if (state.loadedFromCache) {
          els.badgeCacheLoaded.classList.remove('hidden');
        } else {
          els.badgeCacheLoaded.classList.add('hidden');
        }

        calculateSearchResults();
      }
    }

    function updateSearchResultsView() {
      els.searchResultsList.innerHTML = '';

      if (!state.debouncedQuery) {
        els.searchInitialState.classList.remove('hidden');
        els.searchEmptyState.classList.add('hidden');
        els.badgeHitCount.classList.add('hidden');
        els.btnScrollTop.classList.add('hidden');
        return;
      }

      els.searchInitialState.classList.add('hidden');

      if (state.searchResults.length === 0) {
        els.searchEmptyState.classList.remove('hidden');
        els.badgeHitCount.classList.add('hidden');
        els.txtEmptyQuery.textContent = state.debouncedQuery;
        els.btnScrollTop.classList.add('hidden');
        return;
      }

      els.searchEmptyState.classList.add('hidden');
      els.badgeHitCount.classList.remove('hidden');
      els.badgeHitCount.textContent = `${state.searchResults.length} 件ヒット`;

      if (state.searchResults.length > 3) {
        els.btnScrollTop.classList.remove('hidden');
      } else {
        els.btnScrollTop.classList.add('hidden');
      }

      state.searchResults.forEach(result => {
        const card = document.createElement('div');
        card.className = "result-card";
        card.onclick = () => openModal(result.page);

        let matchBadge = '';
        if (result.matchCount > 1) {
          matchBadge = `<span class="badge badge-gray">${result.matchCount}箇所ヒット</span>`;
        }

        card.innerHTML = `
          <div class="result-card-header">
            <div class="result-card-tags">
              <span class="badge badge-primary">ページ ${result.page}</span>
              ${matchBadge}
            </div>
            <span class="result-card-link">実際のページを見る &gt;</span>
          </div>
          <p class="result-card-snippet"></p>
        `;

        const pTag = card.querySelector('p');
        pTag.appendChild(createHighlightedElement(result.snippet, state.debouncedQuery));

        els.searchResultsList.appendChild(card);
      });
    }

    function createHighlightedElement(text, highlight) {
      const container = document.createElement('span');
      const cleanHighlight = highlight.replace(/[\s　]+/g, '');

      if (!cleanHighlight) {
        container.textContent = text;
        return container;
      }

      const regexStr = cleanHighlight
        .split('')
        .map(char => char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .join('\\s*');

      const regex = new RegExp(`(${regexStr})`, 'gi');
      const matchRegex = new RegExp(`^${regexStr}$`, 'i');
      const parts = text.split(regex);

      parts.forEach(part => {
        if (matchRegex.test(part)) {
          const mark = document.createElement('mark');
          mark.textContent = part;
          container.appendChild(mark);
        } else {
          container.appendChild(document.createTextNode(part));
        }
      });
      return container;
    }

    // Modal Logic
    function openModal(pageNumber) {
      const pageData = state.pdfData.find(p => p.page === pageNumber);
      if (!pageData) return;

      state.selectedPage = pageData;
      state.zoom = 1.0;

      updateModalNavigation();

      els.modalOverlay.classList.remove('hidden');
      document.body.classList.add('modal-open');

      setModalViewMode(state.viewMode);
    }

    function updateModalNavigation() {
      if (!state.selectedPage || !state.pdfData) return;

      const currentPage = state.selectedPage.page;
      els.modalTitlePage.textContent = `ページ ${currentPage}`;

      els.btnPrevPage.disabled = currentPage <= 1;
      els.btnNextPage.disabled = currentPage >= state.pdfData.length;

      if (state.debouncedQuery && state.searchResults.length > 0) {
        els.searchNavContainer.classList.remove('hidden');

        const resultIndex = state.searchResults.findIndex(r => r.page === currentPage);

        if (resultIndex !== -1) {
          els.txtResultIndex.textContent = `${resultIndex + 1} / ${state.searchResults.length}`;
        } else {
          els.txtResultIndex.textContent = `- / ${state.searchResults.length}`;
        }

        const hasPrev = state.searchResults.some(r => r.page < currentPage);
        const hasNext = state.searchResults.some(r => r.page > currentPage);

        els.btnPrevResult.disabled = !hasPrev;
        els.btnNextResult.disabled = !hasNext;

      } else {
        els.searchNavContainer.classList.add('hidden');
      }
    }

    function closeModal() {
      if (currentRenderTask) { try { currentRenderTask.cancel(); } catch (e) { } }
      if (currentTextLayerTask) { try { currentTextLayerTask.cancel(); } catch (e) { } }
      state.selectedPage = null;
      els.modalOverlay.classList.add('hidden');
      document.body.classList.remove('modal-open');
    }

    function setModalViewMode(mode) {
      state.viewMode = mode;

      if (mode === 'pdf') {
        els.tabBtnPdf.classList.add('active');
        els.tabBtnText.classList.remove('active');

        els.modalContentPdf.classList.remove('hidden');
        els.modalContentText.classList.add('hidden');

        renderModalPdf();
      } else {
        els.tabBtnText.classList.add('active');
        els.tabBtnPdf.classList.remove('active');

        els.modalContentText.classList.remove('hidden');
        els.modalContentPdf.classList.add('hidden');

        els.modalContentText.innerHTML = '';
        els.modalContentText.appendChild(createHighlightedElement(state.selectedPage.text, state.debouncedQuery));
      }
    }

    async function renderModalPdf() {
      if (!state.pdfDoc || !state.selectedPage) return;

      if (currentRenderTask) { try { await currentRenderTask.cancel(); } catch (e) { } }
      if (currentTextLayerTask) { try { await currentTextLayerTask.cancel(); } catch (e) { } }

      els.pdfLoadingOverlay.classList.remove('hidden');
      els.txtZoomLevel.textContent = `${Math.round(state.zoom * 100)}%`;
      els.btnZoomOut.disabled = state.zoom <= 1.0;
      els.btnZoomIn.disabled = state.zoom >= 3.0;

      try {
        const page = await state.pdfDoc.getPage(state.selectedPage.page);

        const containerWidth = els.pdfScrollContainer.clientWidth;
        const viewportForScale = page.getViewport({ scale: 1.0 });
        const baseScale = (containerWidth - 32) / viewportForScale.width; // 32px padding
        const finalScale = Math.max(baseScale, 0.5) * state.zoom;

        const viewport = page.getViewport({ scale: finalScale });

        els.pdfWrapper.style.width = Math.floor(viewport.width) + "px";
        els.pdfWrapper.style.height = Math.floor(viewport.height) + "px";

        const outputScale = window.devicePixelRatio || 1;
        els.pdfCanvas.width = Math.floor(viewport.width * outputScale);
        els.pdfCanvas.height = Math.floor(viewport.height * outputScale);
        els.pdfCanvas.style.width = Math.floor(viewport.width) + "px";
        els.pdfCanvas.style.height = Math.floor(viewport.height) + "px";

        const context = els.pdfCanvas.getContext('2d');
        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: context,
          transform: transform,
          viewport: viewport
        };

        currentRenderTask = page.render(renderContext);
        await currentRenderTask.promise;

        els.pdfTextLayer.innerHTML = '';
        els.pdfTextLayer.style.width = els.pdfCanvas.style.width;
        els.pdfTextLayer.style.height = els.pdfCanvas.style.height;
        els.pdfTextLayer.style.setProperty('--scale-factor', viewport.scale);

        const textContent = await page.getTextContent();

        currentTextLayerTask = window.pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: els.pdfTextLayer,
          viewport: viewport,
          textDivs: []
        });

        await currentTextLayerTask.promise;

        if (state.debouncedQuery) {
          highlightPdfDOMText(els.pdfTextLayer, state.debouncedQuery);
        }

      } catch (error) {
        if (error.name !== 'RenderingCancelledException') {
          console.error('PDF Render Error:', error);
        }
      } finally {
        els.pdfLoadingOverlay.classList.add('hidden');
      }
    }

    function highlightPdfDOMText(node, query) {
      const cleanQuery = query.replace(/[\s　]+/g, '');
      if (!cleanQuery) return;

      const regexStr = cleanQuery
        .split('')
        .map(char => char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .join('\\s*');

      const regex = new RegExp(`(${regexStr})`, 'gi');
      const matchRegex = new RegExp(`^${regexStr}$`, 'i');

      const spans = node.querySelectorAll('span');

      spans.forEach(span => {
        const text = span.textContent;
        if (new RegExp(regexStr, 'gi').test(text)) {
          const parts = text.split(regex);
          span.innerHTML = '';
          parts.forEach(part => {
            if (matchRegex.test(part)) {
              const mark = document.createElement('mark');
              mark.textContent = part;
              span.appendChild(mark);
            } else {
              span.appendChild(document.createTextNode(part));
            }
          });
        }
      });
    }
  </script>
</body>
